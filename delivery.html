<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Доставка | SHOP.FH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="логотип">SHOP.FH</div>

    <div class="логотип">SHOP.FH</div>

    <nav>

        <a href="index.html">Главная</a>

        <a href="index.html#catalog">Каталог</a>

        <a href="about.html">О нас</a>

        <a href="cart.html" class="cart-icon">

            <svg xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="black"
            viewBox="0 0 24 24">

                <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9
                2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22
                17 22s2-.9 2-2-.9-2-2-2zM7.17 14h9.66c.75 0
                1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 21.3
                5H5.21l-.94-2H1v2h2l3.6 7.59-1.35
                2.44C4.52 16.37 5.48 18 7 18h12v-2H7l1.1-2z"/>
            </svg>

        </a>

    </nav>

</header>

<section class="service-page">

<section class="service-hero">
    <div class="service-card">

        <h1>🚚 Оформление доставки</h1>

        <p>
            Заполните данные, и мы свяжемся с вами
            для подтверждения доставки.
        </p>

        <input type="text" id="delivery-name" placeholder="Ваше имя">
        <input type="tel" id="delivery-phone" placeholder="Телефон">
        <input type="text" id="delivery-address" placeholder="Адрес доставки">

        <button onclick="submitDelivery()">
    Оформить доставку
</button>

        <a href="index.html" class="back-link">← Вернуться на главную</a>

    </div>
</section>

</section>

<script src="script.js"></script>

<div id="delivery-success" class="success-modal">

    <div class="success-box">

        <div class="success-icon">✓</div>

        <h2>Доставка успешно оформлена</h2>

        <p>
            Позже мы с вами свяжемся
            по указанному номеру!
        </p>

        <button onclick="closeDeliveryModal()">
            Хорошо
        </button>

    </div>

</div>

<div id="warning-modal" class="warning-modal">

    <div class="warning-box">

        <div class="warning-icon">!</div>

        <h2>Ошибка</h2>

        <p>
            Пожалуйста, заполните все поля.
        </p>

        <button onclick="closeWarningModal()">
            Понятно
        </button>

    </div>

</div>

</body>
</html>
